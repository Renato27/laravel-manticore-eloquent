name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  # Finds out about a Manticore release that breaks the driver before the next push does.
  schedule:
    - cron: '0 6 * * 1'

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        laravel: ['10.*', '11.*', '12.*', '13.*']
        exclude:
          - php: '8.1'
            laravel: '11.*'
          - php: '8.1'
            laravel: '12.*'
          - php: '8.1'
            laravel: '13.*'
          - php: '8.2'
            laravel: '13.*'
    name: Unit · PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_mysql, mbstring
          coverage: none
      - name: Constrain Laravel version
        run: composer require "laravel/framework:${{ matrix.laravel }}" --no-update --no-interaction
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/pest --testsuite=Unit,Feature

  quality:
    runs-on: ubuntu-latest
    name: Code style and static analysis
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, mbstring
          coverage: none
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/pint --test
      - run: composer analyse

  # Runs every suite, not only Integration, so its report is what the README's tests badge shows.
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manticore: ['28.6.6', 'latest']
    name: Integration · Manticore ${{ matrix.manticore }}
    permissions:
      contents: write
    services:
      manticore:
        image: manticoresearch/manticore:${{ matrix.manticore }}
        ports:
          - 9306:9306
          - 9308:9308
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, pdo_sqlite, mbstring
          coverage: none
      - run: composer update --prefer-dist --no-interaction --no-progress
      - name: Wait for Manticore
        run: |
          for _ in $(seq 1 30); do
            if mysql -h127.0.0.1 -P9306 -e 'SHOW TABLES;' 2>/dev/null; then break; fi
            sleep 2
          done
      - run: vendor/bin/pest --log-junit build/junit.xml
        env:
          MANTICORE_HOST: 127.0.0.1
          MANTICORE_PORT: 9306
      - name: Test auto-embeddings, which download a model
        if: ${{ github.event_name == 'schedule' && matrix.manticore == 'latest' }}
        run: vendor/bin/pest --group=embeddings
        env:
          MANTICORE_HOST: 127.0.0.1
          MANTICORE_PORT: 9306
      - name: Publish the tests badge
        if: ${{ !cancelled() && matrix.manticore == 'latest' && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          php .github/scripts/tests-badge.php build/junit.xml "$RUNNER_TEMP/tests.json"
          cd "$RUNNER_TEMP"
          git init -q -b badges badge
          mv tests.json badge/
          cd badge
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests.json
          git commit -qm 'Update the tests badge'
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:badges
